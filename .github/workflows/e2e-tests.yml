name: E2E tests

# Chi ha avviato l'esecuzione compare nel titolo, es. "E2E · website" o "E2E · schedule".
run-name: E2E · ${{ github.event_name == 'workflow_dispatch' && inputs.source || github.event_name }}

on:
  # Ogni ora, al minuto 17 (evitiamo lo scoccare dell'ora, quando GitHub è più carico).
  schedule:
    - cron: "17 * * * *"
  # A ogni push su main.
  push:
    branches: [main]
  # Su richiesta: dal pulsante "Run workflow" di GitHub o, nella Fase 5, dal sito WordPress.
  workflow_dispatch:
    inputs:
      source:
        description: "Chi ha avviato i test (manual, website)"
        required: false
        default: manual

# Mai due esecuzioni in parallelo: una nuova richiesta aspetta che finisca quella in corso.
concurrency:
  group: e2e-tests
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 1) Gli stessi test, in parallelo, su tre motori di rendering diversi.
  test:
    name: Test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # se un browser fallisce, gli altri continuano
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Install Playwright browser
        run: pwsh bin/Release/net10.0/playwright.ps1 install --with-deps ${{ matrix.browser }}

      # continue-on-error: anche se un test fallisce vogliamo pubblicare i risultati.
      # Il logger GitHubActions è il secondo report: una tabella nel "Job summary".
      - name: Run E2E tests
        id: tests
        continue-on-error: true
        run: >
          dotnet test --configuration Release --no-build
          --logger "console;verbosity=normal"
          --logger "GitHubActions;summary-include-passed=true;summary-include-skipped=true"

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: bin/Release/net10.0/allure-results
          retention-days: 7

      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Uno o più test E2E sono falliti su ${{ matrix.browser }}."
          exit 1

  # 2) Unisce i risultati dei tre browser, genera i report e pubblica i dati per il sito.
  publish:
    needs: test
    if: ${{ !cancelled() }} # pubblichiamo anche quando qualche test è fallito
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      PAGES_URL: https://zancus.github.io/website-quality-lab
      RESULTS_DIR: allure-results

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Allure 3
        run: npm ci

      # Scarica i risultati di tutti i browser nella stessa cartella.
      - name: Download Allure results
        uses: actions/download-artifact@v5
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      # Recupera lo storico pubblicato in precedenza, per i trend nel report.
      - name: Download Allure history
        run: curl -fsSL "$PAGES_URL/history.jsonl" -o history.jsonl || echo "Nessuno storico precedente"

      - name: Generate Allure report
        run: npx allure generate "$RESULTS_DIR" --clean

      # Il report Allure completo NON viene pubblicato: resta un artifact dell'esecuzione.
      - name: Keep Allure report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30

      # Su GitHub Pages pubblichiamo solo i dati che servono alla pagina Playground.
      - name: Prepare public data
        env:
          RUN_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && inputs.source || github.event_name }}
        run: |
          mkdir -p public
          node scripts/summary.mjs "$RESULTS_DIR" public/summary.json
          cp history.jsonl public/history.jsonl

      - name: Upload public data
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
