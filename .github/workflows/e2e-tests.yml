name: E2E tests

# Chi ha avviato l'esecuzione compare nel titolo, es. "E2E · website" o "E2E · schedule".
run-name: E2E · ${{ github.event_name == 'workflow_dispatch' && format('{0} · {1}', inputs.source, inputs.browser || 'all') || github.event_name }}

on:
  # Ogni ora, al minuto 17 (evitiamo lo scoccare dell'ora, quando GitHub è più carico).
  schedule:
    - cron: "17 * * * *"
  # A ogni push su main.
  push:
    branches: [main]
  # Su richiesta: dal pulsante "Run workflow" di GitHub o, nella Fase 5, dal sito WordPress.
  workflow_dispatch:
    inputs:
      source:
        description: "Chi ha avviato i test (manual, website)"
        required: false
        default: manual
      browser:
        description: "Browser su cui eseguire i test"
        type: choice
        required: false
        default: all
        options: [all, desktop, mobile, chromium, msedge, firefox, webkit, iphone, android, ipad, fold, security]
      test_alert:
        description: "Manda un messaggio di prova su Telegram (per verificare la configurazione degli avvisi)"
        type: boolean
        required: false
        default: false

# Due "campetti" con la loro coda: Funzionalità (tutto il resto) e Sicurezza (browser = security).
# Nello stesso campetto una nuova richiesta aspetta che finisca quella in corso;
# una partita di sicurezza invece può giocare insieme a una di funzionalità.
concurrency:
  group: e2e-${{ inputs.browser == 'security' && 'security' || 'functional' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 1) Gli stessi test, in parallelo: 4 browser per computer e 5 dispositivi emulati.
  #    Esecuzioni programmate e push: tutto. Su richiesta (dalla Playground): i browser per computer
  #    ("desktop"), i dispositivi ("mobile", senza il Galaxy Fold che gira solo in automatico),
  #    un solo browser o un solo dispositivo ("ipad" = verticale e orizzontale).
  test:
    name: Test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Immagine ufficiale di Playwright (stessa versione del pacchetto NuGet): Chromium, Firefox e
    # WebKit con tutte le dipendenze di sistema sono già installati, quindi non si scarica nulla
    # dai mirror Ubuntu (che a volte si bloccavano). Gira come root: HOME=/root serve a Firefox.
    container:
      image: mcr.microsoft.com/playwright/dotnet:v1.65.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false # se un browser fallisce, gli altri continuano
      matrix:
        browser: ${{ fromJSON(inputs.browser == 'security' && '["chromium"]' || inputs.browser == 'desktop' && '["chromium","msedge","firefox","webkit"]' || inputs.browser == 'mobile' && '["iphone","android","ipad","ipadland"]' || inputs.browser == 'ipad' && '["ipad","ipadland"]' || (inputs.browser && inputs.browser != 'all') && format('["{0}"]', inputs.browser) || '["chromium","msedge","firefox","webkit","iphone","android","ipad","ipadland","fold"]') }}
    env:
      # Motore di Playwright per ogni voce della matrice:
      #   Edge è Chromium con il channel "msedge"; Android e Galaxy Fold sono Chromium emulato;
      #   iPhone e iPad (verticale e orizzontale) sono WebKit emulato.
      BROWSER: ${{ contains(fromJSON('["msedge","android","fold"]'), matrix.browser) && 'chromium' || contains(fromJSON('["iphone","ipad","ipadland"]'), matrix.browser) && 'webkit' || matrix.browser }}
      CHANNEL_ARGS: ${{ matrix.browser == 'msedge' && '-- Playwright.LaunchOptions.Channel=msedge' || '' }}
      # Dispositivo emulato (schermo, touch, user agent) letto dai test in QualityLabTest.cs.
      QLP_DEVICE: ${{ contains(fromJSON('["iphone","android","ipad","fold","ipadland"]'), matrix.browser) && matrix.browser || '' }}
      # I controlli di sicurezza (header, redirect, certificato) danno lo stesso risultato con
      # qualsiasi browser: girano solo su Chromium, invece di ripetere le stesse richieste 9 volte.
      #   - partita di sicurezza (browser = security): solo i controlli di sicurezza;
      #   - partita di funzionalità avviata dal sito: nessun controllo di sicurezza (hanno il loro campetto);
      #   - esecuzioni orarie, push e avvii manuali: tutto, con la sicurezza solo su Chromium.
      TEST_FILTER: ${{ inputs.browser == 'security' && '--filter TestCategory=Security' || (inputs.source == 'website' || matrix.browser != 'chromium') && '--filter TestCategory!=Security' || '' }}
      HOME: /root

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Il codice dei test di sicurezza vive in un repository PRIVATO
      # (website-quality-lab-security): non è pubblico. Prima della build lo
      # recuperiamo e lo copiamo in Tests/, così l'assembly compilato e la pagina
      # Playground restano identici a prima. Serve il secret SECURITY_REPO_TOKEN,
      # un token di sola lettura sul repo privato.
      # continue-on-error: se il token manca o il checkout fallisce, i test
      # funzionali girano comunque; mancano solo i controlli di sicurezza.
      - name: Checkout test di sicurezza (repo privato)
        id: security_checkout
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: MattiaZanchin94/website-quality-lab-security
          token: ${{ secrets.SECURITY_REPO_TOKEN }}
          path: .security-tests

      - name: Inietta i test di sicurezza
        run: |
          if [ -f .security-tests/Tests/SecurityTests.cs ]; then
            cp .security-tests/Tests/SecurityTests.cs Tests/SecurityTests.cs
            echo "Test di sicurezza iniettati da website-quality-lab-security."
          else
            echo "::warning::Repo privato dei test di sicurezza non disponibile (secret SECURITY_REPO_TOKEN mancante o checkout fallito). Procedo senza i controlli di sicurezza."
          fi

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release

      # Solo Edge va installato: è il browser vero di Microsoft, non incluso nell'immagine.
      # Arriva dal repository di Microsoft; ogni tentativo ha 4 minuti, al massimo 3 tentativi.
      # Usiamo il driver Node incluso nel pacchetto Playwright (nell'immagine non serve PowerShell).
      - name: Install Microsoft Edge
        if: matrix.browser == 'msedge'
        run: |
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'DPkg::Lock::Timeout "120";' \
            > /etc/apt/apt.conf.d/99quality-lab
          driver=bin/Release/net10.0/.playwright
          for attempt in 1 2 3; do
            if timeout 240 "$driver/node/linux-x64/node" "$driver/package/cli.js" install --force msedge; then
              exit 0
            fi
            echo "::warning::Installazione di Edge non riuscita (tentativo $attempt di 3), riprovo."
            pkill -x apt-get || true
            pkill -x dpkg || true
            sleep 5
            dpkg --configure -a || true
          done
          exit 1

      # continue-on-error: anche se un test fallisce vogliamo pubblicare i risultati.
      # Il logger GitHubActions è il secondo report: una tabella nel "Job summary".
      - name: Run E2E tests
        id: tests
        continue-on-error: true
        timeout-minutes: 10 # se si blocca, i risultati raccolti fin lì vengono comunque caricati
        env:
          # Avanzamento in diretta sulla pagina Playground (vedi Tests/LiveProgress.cs).
          # Se il secret non è configurato, l'invio è disattivato e i test girano normalmente.
          QLP_PROGRESS_URL: https://mattiazanchin.com/wp-json/quality-lab/v1/progress
          QLP_PROGRESS_KEY: ${{ secrets.QLP_PROGRESS_KEY }}
        run: >
          dotnet test --configuration Release --no-build
          --logger "console;verbosity=normal"
          --logger "GitHubActions;summary-include-passed=true;summary-include-skipped=true"
          $TEST_FILTER
          $CHANNEL_ARGS

      - name: Upload Allure results
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.browser }}
          path: bin/Release/net10.0/allure-results
          retention-days: 7

      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Uno o più test E2E sono falliti su ${{ matrix.browser }}."
          exit 1

  # 2) Unisce i risultati dei browser, genera i report e pubblica i dati per il sito.
  publish:
    needs: test
    # Le pubblicazioni vanno in fila indiana, anche quando due campetti giocano insieme: ognuna parte
    # dal summary.json precedente, e due in parallelo si cancellerebbero i risultati a vicenda.
    concurrency:
      group: e2e-publish
      cancel-in-progress: false
    # always(): pubblichiamo anche quando un test fallisce o un browser va in timeout;
    # per un browser mancante summary.mjs tiene i risultati dell'esecuzione precedente.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # per leggere l'ora di inizio dell'esecuzione
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      PAGES_URL: https://mattiazanchin94.github.io/website-quality-lab
      RESULTS_DIR: allure-results

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Allure 3
        run: npm ci

      # Scarica i risultati di tutti i browser nella stessa cartella.
      - name: Download Allure results
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      # Recupera lo storico Allure e l'ultimo summary.json pubblicati in precedenza:
      # se questa esecuzione riguarda un solo browser, gli altri mantengono i loro ultimi risultati.
      - name: Download previous data
        run: |
          curl -fsSL "$PAGES_URL/history.jsonl" -o history.jsonl || echo "Nessuno storico precedente"
          curl -fsSL "$PAGES_URL/summary.json" -o previous-summary.json || echo "Nessun summary precedente"

      - name: Generate Allure report
        run: npx allure generate "$RESULTS_DIR" --clean

      # Il report Allure completo NON viene pubblicato: resta un artifact dell'esecuzione.
      - name: Keep Allure report as artifact
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
          retention-days: 30

      # Su GitHub Pages pubblichiamo solo i dati che servono alla pagina Playground.
      # RUN_STARTED_AT: quando GitHub ha avviato questa esecuzione (dopo l'eventuale coda).
      # Serve a mostrare sulla Playground la durata totale, non solo il tempo dei test.
      - name: Prepare public data
        env:
          RUN_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && inputs.source || github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export RUN_STARTED_AT=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" | jq -r '.run_started_at // empty') || true
          echo "Esecuzione avviata alle: ${RUN_STARTED_AT:-sconosciuto}"
          mkdir -p public
          node scripts/summary.mjs "$RESULTS_DIR" public/summary.json previous-summary.json
          cp history.jsonl public/history.jsonl

      - name: Upload public data
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      # Avviso su Telegram quando i controlli smoke cambiano stato (verde → rosso, rosso → verde).
      # Token e chat id sono secrets del repository: se mancano, il passaggio non fa nulla.
      # continue-on-error: un problema con Telegram non deve far fallire la pubblicazione.
      - name: Telegram alert
        if: ${{ always() }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_TEST: ${{ inputs.test_alert && 'true' || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify.mjs public/summary.json previous-summary.json
